[project]
name = "ai-resume-screening"
version = "0.1.0"
description = "AI-powered resume screening and candidate shortlisting with fairness-aware ML and explainable AI."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "pydantic",
    "python-dotenv",
    "pymupdf",
    "python-docx",
    "spacy",
    "sentence-transformers",
    "scikit-learn",
    "fairlearn",
    "shap",
    "pandas",
    "numpy",
    "python-multipart>=0.0.32",
    "matplotlib>=3.11.1",
    "en-core-web-sm",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
